[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "saliencegate"
version = "0.1.0"
description = "Budget-aware memory intervention for long-horizon agents"
readme = "docs/package-description.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "agents",
  "long-horizon",
  "memory",
  "runtime",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
model-runtime = [
  "httpx>=0.28.1,<0.29",
  "openai-harmony==0.0.8",
]

[project.scripts]
saliencegate = "saliencegate.cli:entrypoint"
saliencegate-review = "saliencegate.benchmarks.state_decay_v2.review_cli:entrypoint"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "editables>=0.3,<0.4",
  "hatchling>=1.27,<2",
  "httpx>=0.28.1,<0.29",
  "hypothesis>=6.135,<7",
  "mypy>=1.17,<2",
  "openai-harmony==0.0.8",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saliencegate"]
artifacts = [
  "src/saliencegate/integrations/fixtures/*.json",
  "src/saliencegate/integrations/profiles.json",
  "src/saliencegate/repository/migrations/*.sql",
  "src/saliencegate/shadow/atif_profile_compatibility.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/SECURITY.md",
  "/benchmarks",
  "/docs/benchmarks",
  "/docs/assets",
  "/docs/package-description.md",
  "/docs/research-claims.md",
  "/docs/reference",
  "/docs/security.md",
  "/examples",
  "/scripts",
  "/src",
  "/tests",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--disable-socket",
  "--allow-unix-socket",
  "-ra",
]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["saliencegate"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["saliencegate"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = true
