          "$RUNNER_TEMP/sdist-venv/bin/python" -I scripts/run_without_sockets.py "$RUNNER_TEMP/sdist-venv/bin/saliencegate-review" review --help >> "$RUNNER_TEMP/sdist-output/review-help.txt"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I scripts/run_without_sockets.py "$RUNNER_TEMP/sdist-venv/bin/saliencegate-review" status --help >> "$RUNNER_TEMP/sdist-output/review-help.txt"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I scripts/run_without_sockets.py "$RUNNER_TEMP/sdist-venv/bin/saliencegate-review" build-envelope --help >> "$RUNNER_TEMP/sdist-output/review-help.txt"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I scripts/run_without_sockets.py scripts/smoke_launch_contracts.py "$RUNNER_TEMP/sdist-output/launch-demo.json" "$RUNNER_TEMP/sdist-output/review-help.txt"

  installed-model-runtime:
    name: Smoke-test the installed optional model runtime
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ""
    steps:
      - name: Check out the locked dependency graph
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Download the distributions built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Export the hash-locked optional runtime dependencies
        run: uv export --locked --all-extras --no-dev --no-emit-project --output-file "$RUNNER_TEMP/model-runtime-requirements.txt" --quiet
      - name: Install the optional runtime and built wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/model-runtime-venv"
          uv pip install --python "$RUNNER_TEMP/model-runtime-venv/bin/python" --require-hashes -r "$RUNNER_TEMP/model-runtime-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/model-runtime-venv/bin/python" --no-deps dist/*.whl
      - name: Construct a loopback configuration without a request
        run: |
          "$RUNNER_TEMP/model-runtime-venv/bin/python" -I scripts/run_without_sockets.py scripts/smoke_model_runtime.py
