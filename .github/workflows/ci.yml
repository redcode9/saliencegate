name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.shard.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        shard:
          - name: core
            pytest_args: >-
              tests
              --ignore=tests/benchmarks/state_decay_v2
          - name: state-decay-v2
            pytest_args: >-
              tests/benchmarks/state_decay_v2
              --ignore=tests/benchmarks/state_decay_v2/test_public_review_io.py
              --ignore=tests/benchmarks/state_decay_v2/test_public_review.py
              --ignore=tests/benchmarks/state_decay_v2/test_public_review_cli.py
              --ignore=tests/benchmarks/state_decay_v2/test_public_review_pack.py
          - name: review-io
            pytest_args: >-
              tests/benchmarks/state_decay_v2/test_public_review_io.py
          - name: review-cli-pack
            pytest_args: >-
              tests/benchmarks/state_decay_v2/test_public_review.py
              tests/benchmarks/state_decay_v2/test_public_review_cli.py
              tests/benchmarks/state_decay_v2/test_public_review_pack.py
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Install uv with a dependency-only cache
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: false
          prune-cache: true
          save-cache: ${{ github.event_name == 'push' }}
      - name: Install the locked development environment
        run: |
          uv sync --locked --all-extras --dev --no-install-project
          uv sync --locked --all-extras --dev --no-build-isolation
      - name: Verify the selected Python
        run: >-
          uv run --locked python -c
          "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')))"
      - name: Run the compatibility shard
        if: matrix.python-version != '3.12'
        run: >-
          uv run --locked pytest
          ${{ matrix.shard.pytest_args }}
      - name: Run the authoritative coverage shard
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard.name }}
        run: >-
          uv run --locked pytest
          --cov=saliencegate
          --cov-branch
          --cov-report=
          --cov-fail-under=0
          ${{ matrix.shard.pytest_args }}
      - name: Upload the coverage shard
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard.name }}
          path: .coverage.${{ matrix.shard.name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Static, docs, and dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked development environment
        run: |
          uv sync --locked --all-extras --dev --no-install-project
          uv sync --locked --all-extras --dev --no-build-isolation
      - name: Run static and evidence gates
        run: make format lint typecheck docs-check audit

  coverage:
    name: Authoritative branch coverage
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked development environment
        run: |
          uv sync --locked --all-extras --dev --no-install-project
          uv sync --locked --all-extras --dev --no-build-isolation
      - name: Download every coverage shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce authoritative branch coverage
        run: |
          uv run --locked coverage combine coverage-data
          uv run --locked coverage report --show-missing --fail-under=0
          uv run --locked coverage json --fail-under=0 -o .coverage.json
          uv run --locked python scripts/check_coverage_thresholds.py .coverage.json --minimum 95

  shadow-benchmark-evidence:
    name: Shadow benchmark contract and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked benchmark contract environment
        run: |
          uv sync --locked --dev --no-install-project
          uv sync --locked --dev --no-build-isolation
      - name: Verify the benchmark contract and sealed reference evidence
        run: |
          uv run --locked pytest -q \
            tests/test_shadow_trace_benchmark.py \
            tests/test_readme_visuals.py
          uv run --locked python scripts/check_readme_visuals.py

  capture-benchmark-contracts:
    name: Capture benchmark contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: provider-credential-read-must-fail
      AZURE_OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_ORGANIZATION: provider-credential-read-must-fail
      OPENAI_ORG_ID: provider-credential-read-must-fail
      OPENAI_PROJECT: provider-credential-read-must-fail
      OPENAI_PROJECT_ID: provider-credential-read-must-fail
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked capture benchmark contract environment
        run: |
          uv sync --locked --dev --no-install-project
          uv sync --locked --dev --no-build-isolation
      - name: Verify the hook and report benchmark contracts
        run: |
          uv run --locked pytest -q \
            tests/test_capture_hook_benchmark.py \
            tests/test_capture_report_benchmark.py

  connectors:
    name: Exact Node connector gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: provider-credential-read-must-fail
      AZURE_OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_ORGANIZATION: provider-credential-read-must-fail
      OPENAI_ORG_ID: provider-credential-read-must-fail
      OPENAI_PROJECT: provider-credential-read-must-fail
      OPENAI_PROJECT_ID: provider-credential-read-must-fail
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          check-latest: false
          package-manager-cache: false
      - name: Typecheck, test, benchmark, audit, and reproduce bundles
        run: make connector-source-check

  capture-platform-contract:
    name: Capture platform contract (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: macos-15
            runner: macos-15
          - platform: windows-2025
            runner: windows-2025
    env:
      ANTHROPIC_API_KEY: provider-credential-read-must-fail
      AZURE_OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_ORGANIZATION: provider-credential-read-must-fail
      OPENAI_ORG_ID: provider-credential-read-must-fail
      OPENAI_PROJECT: provider-credential-read-must-fail
      OPENAI_PROJECT_ID: provider-credential-read-must-fail
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the reference Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked platform contract environment
        run: |
          uv sync --locked --dev --no-install-project
          uv sync --locked --dev --no-build-isolation
      - name: Exercise native capture, launcher, and file-security boundaries
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/capture-platform-home
          USERPROFILE: ${{ runner.temp }}/capture-platform-home
          XDG_CACHE_HOME: ${{ runner.temp }}/capture-platform-home/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/capture-platform-home/config
          XDG_DATA_HOME: ${{ runner.temp }}/capture-platform-home/data
          XDG_STATE_HOME: ${{ runner.temp }}/capture-platform-home/state
          APPDATA: ${{ runner.temp }}/capture-platform-home/appdata
          LOCALAPPDATA: ${{ runner.temp }}/capture-platform-home/localappdata
        run: >-
          uv run --locked pytest -q
          tests/security/test_windows.py
          tests/capture/test_store_security.py
          tests/capture/test_spool.py
          tests/integrations/test_hook.py
          tests/integrations/test_installation.py
          tests/integrations/test_launcher_renderer.py
      - name: Prepare the Windows test root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:SystemDrive "saliencegate-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root | Out-Null
          $ownerSid = [Security.Principal.WindowsIdentity]::GetCurrent().Owner.Value
          & icacls.exe $root /inheritance:r /grant:r "*${ownerSid}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to secure the Windows test root"
          }
          New-Item -ItemType Directory -Path (Join-Path $root "temp") | Out-Null
          "SALIENCEGATE_CI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise native Windows capture, launcher, and file-security boundaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $captureHome = Join-Path $env:SALIENCEGATE_CI_ROOT "home"
          $env:HOME = $captureHome
          $env:USERPROFILE = $captureHome
          $env:XDG_CACHE_HOME = Join-Path $captureHome "cache"
          $env:XDG_CONFIG_HOME = Join-Path $captureHome "config"
          $env:XDG_DATA_HOME = Join-Path $captureHome "data"
          $env:XDG_STATE_HOME = Join-Path $captureHome "state"
          $env:APPDATA = Join-Path $captureHome "appdata"
          $env:LOCALAPPDATA = Join-Path $captureHome "localappdata"
          $env:TEMP = Join-Path $env:SALIENCEGATE_CI_ROOT "temp"
          $env:TMP = $env:TEMP
          $tests = @(
            "tests/security/test_windows.py"
            "tests/capture/test_store_security.py::test_native_windows_operations_authorize_a_real_private_directory"
            "tests/capture/test_spool.py::test_read_only_audit_authenticates_an_empty_spool_without_creating_a_lock"
            "tests/integrations/test_hook.py::test_windows_launcher_encodes_the_native_contract"
            "tests/integrations/test_hook.py::test_windows_launcher_preserves_stdin_argv_silence_and_timeout_with_pinned_watchdog"
            "tests/integrations/test_installation.py::test_native_windows_pristine_missing_operational_parent_is_clean_and_installable"
            "tests/integrations/test_installation.py::test_native_windows_dry_run_rejects_missing_operational_suffix_below_junction"
            "tests/integrations/test_installation.py::test_native_windows_install_inspect_and_uninstall_round_trip"
            "tests/integrations/test_installation.py::test_native_windows_existing_provider_directory_acl_is_not_rewritten"
            "tests/integrations/test_launcher_renderer.py"
          )
          uv run --locked pytest -q --basetemp (Join-Path $env:SALIENCEGATE_CI_ROOT "pytest") @tests

  build:
    name: Build distributions once
    needs:
      - test
      - quality
      - coverage
      - shadow-benchmark-evidence
      - capture-benchmark-contracts
      - connectors
      - capture-platform-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked build backend
        run: |
          uv sync --locked --all-extras --dev --no-install-project
          uv sync --locked --all-extras --dev --no-build-isolation
      - name: Build wheel and source distribution
        run: uv build --no-build-isolation --clear --no-create-gitignore
      - name: Require exactly one wheel and one source distribution
        run: |
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 1
      - name: Verify distribution membership
        run: SALIENCEGATE_REQUIRE_DISTRIBUTIONS=1 uv run --locked pytest -q tests/test_package.py
      - name: Upload distributions only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  artifact-only-atif:
    name: Prove ATIF from artifacts only (${{ matrix.platform }})
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: macos-15
            runner: macos-15
    env:
      PYTHONPATH: ""
    steps:
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Select the artifact work root
        shell: bash
        run: echo "ARTIFACT_WORK_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download the distributions built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/saliencegate-artifact-only/dist
      - name: Recover the shared artifact verifier from the sdist
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/saliencegate-artifact-only
        shell: python
        run: |
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["ARTIFACT_ROOT"]).resolve(strict=True)
          dist = root / "dist"
          children = tuple(dist.iterdir())
          if len(children) != 2 or any(
              not child.is_file() or child.is_symlink() for child in children
          ):
              raise SystemExit("downloaded artifact set must contain two regular files")
          wheels = tuple(child for child in children if child.suffix == ".whl")
          sdists = tuple(child for child in children if child.name.endswith(".tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("downloaded artifact set must contain one wheel and one sdist")
          launcher = root / "launcher"
          launcher.mkdir(mode=0o700)
          with tarfile.open(sdists[0], mode="r:gz") as archive:
              matches = tuple(
                  member
                  for member in archive.getmembers()
                  if member.isfile()
                  and len(PurePosixPath(member.name).parts) == 3
                  and PurePosixPath(member.name).parts[1:]
                  == ("scripts", "verify_built_artifacts.py")
              )
              if len(matches) != 1:
                  raise SystemExit("sdist must contain exactly one artifact verifier")
              stream = archive.extractfile(matches[0])
              if stream is None:
                  raise SystemExit("artifact verifier could not be read")
              target = launcher / "scripts" / "verify_built_artifacts.py"
              target.parent.mkdir(mode=0o700)
              with target.open("xb") as output:
                  output.write(stream.read())
      - name: Prove documented commands from wheel and sdist
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/saliencegate-artifact-only
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"]).resolve(strict=True)
          work_root = Path(os.environ["ARTIFACT_WORK_ROOT"]).resolve()
          subprocess.run(
              (
                  sys.executable,
                  str(root / "launcher" / "scripts" / "verify_built_artifacts.py"),
                  "--dist-dir",
                  str(root / "dist"),
                  "--work-dir",
                  str(work_root / "proof"),
                  "--python",
                  "3.12",
              ),
              check=True,
          )

  artifact-only-connectors:
    name: Prove connectors from artifacts only (${{ matrix.platform }})
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: macos-15
            runner: macos-15
          - platform: windows-2025
            runner: windows-2025
    env:
      PYTHONPATH: ""
      ANTHROPIC_API_KEY: provider-credential-read-must-fail
      AZURE_OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_API_KEY: provider-credential-read-must-fail
      OPENAI_ORGANIZATION: provider-credential-read-must-fail
      OPENAI_ORG_ID: provider-credential-read-must-fail
      OPENAI_PROJECT: provider-credential-read-must-fail
      OPENAI_PROJECT_ID: provider-credential-read-must-fail
    steps:
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Select exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          check-latest: false
          package-manager-cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Select the POSIX artifact work root
        if: runner.os != 'Windows'
        shell: bash
        run: echo "ARTIFACT_WORK_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare the Windows artifact work root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:SystemDrive "saliencegate-connectors-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root | Out-Null
          $ownerSid = [Security.Principal.WindowsIdentity]::GetCurrent().Owner.Value
          & icacls.exe $root /inheritance:r /grant:r "*${ownerSid}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to secure the Windows artifact work root"
          }
          "ARTIFACT_WORK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download the distributions built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/saliencegate-connector-artifact-only/dist
      - name: Recover the connector artifact verifiers from the sdist
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/saliencegate-connector-artifact-only
        shell: python
        run: |
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["ARTIFACT_ROOT"]).resolve(strict=True)
          dist = root / "dist"
          children = tuple(dist.iterdir())
          if len(children) != 2 or any(
              not child.is_file() or child.is_symlink() for child in children
          ):
              raise SystemExit("downloaded artifact set must contain two regular files")
          wheels = tuple(child for child in children if child.suffix == ".whl")
          sdists = tuple(child for child in children if child.name.endswith(".tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("downloaded artifact set must contain one wheel and one sdist")
          launcher = root / "launcher"
          launcher.mkdir(mode=0o700)
          expected = {
              ("scripts", "verify_built_artifacts.py"),
              ("scripts", "verify_connector_artifacts.py"),
          }
          with tarfile.open(sdists[0], mode="r:gz") as archive:
              members = tuple(archive.getmembers())
              for relative in sorted(expected):
                  matches = tuple(
                      member
                      for member in members
                      if member.isfile()
                      and len(PurePosixPath(member.name).parts) == 3
                      and PurePosixPath(member.name).parts[1:] == relative
                  )
                  if len(matches) != 1:
                      raise SystemExit(
                          "sdist must contain exactly one of each connector artifact verifier"
                      )
                  member = matches[0]
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit("connector artifact verifier could not be read")
                  target = launcher.joinpath(*relative)
                  target.parent.mkdir(mode=0o700, exist_ok=True)
                  with target.open("xb") as output:
                      output.write(stream.read())
      - name: Prove installed callbacks and bundles with network and credentials denied
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/saliencegate-connector-artifact-only
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"]).resolve(strict=True)
          work_root = Path(os.environ["ARTIFACT_WORK_ROOT"]).resolve()
          home = work_root / "home"
          environment = dict(os.environ)
          environment.update(
              {
                  "HOME": str(home),
                  "XDG_CACHE_HOME": str(home / "cache"),
                  "XDG_CONFIG_HOME": str(home / "config"),
                  "XDG_DATA_HOME": str(home / "data"),
                  "XDG_STATE_HOME": str(home / "state"),
                  "USERPROFILE": str(home),
                  "APPDATA": str(home / "appdata"),
                  "LOCALAPPDATA": str(home / "localappdata"),
              }
          )
          subprocess.run(
              (
                  sys.executable,
                  str(root / "launcher" / "scripts" / "verify_connector_artifacts.py"),
                  "--dist-dir",
                  str(root / "dist"),
                  "--work-dir",
                  str(work_root / "proof"),
                  "--node",
                  "node",
                  "--npm",
                  "npm",
              ),
              check=True,
              env=environment,
          )
          subprocess.run(
              (
                  sys.executable,
                  str(root / "launcher" / "scripts" / "verify_built_artifacts.py"),
                  "--dist-dir",
                  str(root / "dist"),
                  "--work-dir",
                  str(work_root / "installed-proof"),
                  "--python",
                  "3.12",
                  "--node",
                  "node",
                  "--capture-connectors-only",
              ),
              check=True,
              env=environment,
          )

