          HOME="$RUNNER_TEMP/sdist-home" "$RUNNER_TEMP/sdist-venv/bin/python" -I scripts/run_without_sockets.py scripts/smoke_shadow_installed.py validate-report "$RUNNER_TEMP/sdist-shadow/shadow-report.json" "$RUNNER_TEMP/sdist-shadow/shadow-command.json" b35f05f3-555b-4f09-8996-a7b3693bb54a
          install -m 600 "$RUNNER_TEMP/sdist-package/examples/atif-shadow/codex-minimal.trajectory.json" "$RUNNER_TEMP/sdist-shadow/example-codex.trajectory.json"
          install -m 600 "$RUNNER_TEMP/sdist-package/examples/atif-shadow/terminus-minimal.trajectory.json" "$RUNNER_TEMP/sdist-shadow/example-terminus.trajectory.json"
