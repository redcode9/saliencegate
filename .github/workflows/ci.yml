  installed-sdist:
    name: Test the installed source distribution
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ""
    steps:
      - name: Check out offline smoke fixtures
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Download the distributions built by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Extract the packaged public example
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-package"
          chmod 700 "$RUNNER_TEMP/sdist-package"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/sdist-package"
      - name: Export hash-locked core runtime and build constraints
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/sdist-core-runtime-requirements.txt" --quiet
          uv export --locked --only-dev --no-emit-project --output-file "$RUNNER_TEMP/sdist-build-constraints.txt" --quiet
      - name: Install the source distribution without isolated resolution
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdist-venv"
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" --require-hashes -r "$RUNNER_TEMP/sdist-core-runtime-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" --require-hashes --constraints "$RUNNER_TEMP/sdist-build-constraints.txt" hatchling==1.31.0
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" --no-deps --no-build-isolation dist/*.tar.gz
      - name: Exercise installed Shadow Mode without network or optional runtime
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/sdist-home" "$RUNNER_TEMP/sdist-shadow"
          chmod 700 "$RUNNER_TEMP/sdist-home" "$RUNNER_TEMP/sdist-shadow"
