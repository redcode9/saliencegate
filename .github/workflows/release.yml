name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked build environment
        run: |
          uv sync --locked --all-extras --dev --no-install-project
          uv sync --locked --all-extras --dev --no-build-isolation
      - name: Verify the tag and installer contracts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("release tag does not match the package version")
          PY
          uv run --locked pytest -q tests/test_installer.py tests/cli/test_global_capture.py
      - name: Build and verify distributions
        run: |
          uv build --no-build-isolation --clear --no-create-gitignore
          SALIENCEGATE_REQUIRE_DISTRIBUTIONS=1 uv run --locked pytest -q tests/test_package.py
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "SalienceGate $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
