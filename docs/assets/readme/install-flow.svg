<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="100%" role="img" aria-labelledby="install-flow-title install-flow-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="install-flow-title">SalienceGate one-command setup flow</title>
  <desc id="install-flow-desc">Run one terminal command, choose Codex, Claude Code, OpenCode, or Pi, then capture coding sessions locally in the selected projects or globally.</desc>
  <rect data-surface="true" width="1600" height="760" rx="24" fill="#f6f1e8"/>

  <text x="64" y="82" fill="#22211f" font-size="52" font-weight="750" letter-spacing="-1">One command. Every coding session, locally.</text>
  <text x="64" y="128" fill="#4f4c47" font-size="28">Install once, choose your providers and decide where SalienceGate connects.</text>

  <rect x="54" y="184" width="460" height="420" rx="18" fill="#22211f"/>
  <circle cx="88" cy="218" r="8" fill="#d48a2c"/>
  <circle cx="116" cy="218" r="8" fill="#dce9e9"/>
  <circle cx="144" cy="218" r="8" fill="#6d929d"/>
  <text x="82" y="286" fill="#b5ccd1" font-size="23" font-weight="700" letter-spacing="2">01  TERMINAL</text>
  <text x="82" y="352" fill="#ffffff" font-size="31" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">$ curl -LsSf &#x2026;</text>
  <text x="82" y="398" fill="#ffffff" font-size="31" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">  /install.sh | sh</text>
  <rect x="82" y="444" width="322" height="54" rx="27" fill="#315f6f"/>
  <circle cx="114" cy="471" r="11" fill="#dce9e9"/>
  <text x="140" y="480" fill="#ffffff" font-size="25" font-weight="700">Ready for setup</text>
  <text x="82" y="548" fill="#c9c4bb" font-size="24">No admin access required</text>

  <line x1="526" y1="394" x2="558" y2="394" stroke="#315f6f" stroke-width="6" stroke-linecap="round"/>
  <path d="M548 380l18 14-18 14" fill="none" stroke="#315f6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="578" y="184" width="444" height="420" rx="18" fill="#ffffff" stroke="#315f6f" stroke-width="4"/>
  <text x="610" y="242" fill="#315f6f" font-size="23" font-weight="700" letter-spacing="2">02  CONNECT</text>
  <text x="610" y="292" fill="#22211f" font-size="34" font-weight="750">Choose your providers</text>
  <rect x="610" y="330" width="174" height="76" rx="12" fill="#dce9e9"/>
  <circle cx="642" cy="368" r="13" fill="#315f6f"/>
  <path d="M636 368l5 5 9-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="668" y="377" fill="#22211f" font-size="25" font-weight="700">Codex</text>
  <rect x="816" y="330" width="174" height="76" rx="12" fill="#dce9e9"/>
  <circle cx="848" cy="368" r="13" fill="#315f6f"/>
  <path d="M842 368l5 5 9-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="874" y="377" fill="#22211f" font-size="25" font-weight="700">Claude</text>
  <rect x="610" y="430" width="174" height="76" rx="12" fill="#dce9e9"/>
  <circle cx="642" cy="468" r="13" fill="#315f6f"/>
  <path d="M636 468l5 5 9-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="668" y="477" fill="#22211f" font-size="23" font-weight="700">OpenCode</text>
  <rect x="816" y="430" width="174" height="76" rx="12" fill="#dce9e9"/>
  <circle cx="848" cy="468" r="13" fill="#315f6f"/>
  <path d="M842 468l5 5 9-11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="874" y="477" fill="#22211f" font-size="25" font-weight="700">Pi</text>
  <text x="610" y="558" fill="#4f4c47" font-size="24">Per project or global</text>

  <line x1="1034" y1="394" x2="1066" y2="394" stroke="#9b5c13" stroke-width="6" stroke-linecap="round"/>
  <path d="M1056 380l18 14-18 14" fill="none" stroke="#9b5c13" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1086" y="184" width="460" height="420" rx="18" fill="#f1e0c6" stroke="#9b5c13" stroke-width="4"/>
  <text x="1118" y="242" fill="#7a470d" font-size="23" font-weight="700" letter-spacing="2">03  CAPTURE</text>
  <text x="1118" y="292" fill="#22211f" font-size="34" font-weight="750">Sessions stay local</text>
  <path d="M1154 360h90l28 28h214v142h-332z" fill="#ffffff" stroke="#9b5c13" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1178 427h164M1178 461h230M1178 495h184" fill="none" stroke="#315f6f" stroke-width="12" stroke-linecap="round"/>
  <circle cx="1450" cy="496" r="18" fill="#d48a2c"/>
  <text x="1118" y="568" fill="#5f482e" font-size="24">Your machine · Your projects</text>

  <rect x="54" y="640" width="1492" height="70" rx="14" fill="#dce9e9"/>
  <text x="800" y="686" fill="#315f6f" font-size="27" font-weight="700" text-anchor="middle">Connect once. Observe continuously. Keep control.</text>
</svg>
