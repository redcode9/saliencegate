  <text data-metric="no-current-evidence.detected_signals" x="888" y="470" fill="#22211f" font-size="40" font-weight="700">0</text>
  <line x1="600" y1="492" x2="1000" y2="492" stroke="#c7c0b4" stroke-width="3"/>
  <text x="600" y="536" fill="#22211f" font-size="28">repeated_action</text>
  <text data-metric="no-current-evidence.repeated_action.detected" x="960" y="536" fill="#22211f" font-size="28" font-weight="700">0</text>
  <text x="600" y="578" fill="#22211f" font-size="28">tool_error</text>
  <text data-metric="no-current-evidence.tool_error.detected" x="960" y="578" fill="#22211f" font-size="28" font-weight="700">0</text>
