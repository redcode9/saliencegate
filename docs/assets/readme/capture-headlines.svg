  <text data-metric="no-current-evidence.headline" x="600" y="270" fill="#22211f" font-size="28" font-weight="700">no_current_evidence</text>
  <text data-summary="no-current-evidence" data-estimated-width="312" x="600" y="320" fill="#22211f" font-size="28">Closed clean window</text>
  <text data-summary="no-current-evidence" data-estimated-width="254" x="600" y="356" fill="#22211f" font-size="28">with two distinct</text>
  <text data-summary="no-current-evidence" data-estimated-width="279" x="600" y="392" fill="#22211f" font-size="28">successful actions</text>
  <text x="600" y="432" fill="#22211f" font-size="28">actions</text>
  <text data-metric="no-current-evidence.action_identities" x="600" y="470" fill="#22211f" font-size="40" font-weight="700">2</text>
