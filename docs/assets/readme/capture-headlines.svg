  <text data-summary="insufficient-evidence" data-estimated-width="329" x="1110" y="320" fill="#22211f" font-size="28">Open window with one</text>
  <text data-summary="insufficient-evidence" data-estimated-width="350" x="1110" y="356" fill="#22211f" font-size="28">unresolved action and a</text>
  <text data-summary="insufficient-evidence" data-estimated-width="194" x="1110" y="392" fill="#22211f" font-size="28">transport gap</text>
  <text x="1110" y="432" fill="#22211f" font-size="28">actions</text>
  <text data-metric="insufficient-evidence.action_identities" x="1110" y="470" fill="#22211f" font-size="40" font-weight="700">1</text>
  <text x="1254" y="432" fill="#22211f" font-size="28">results</text>
  <text data-metric="insufficient-evidence.structured_results" x="1254" y="470" fill="#22211f" font-size="40" font-weight="700">0</text>
  <text x="1398" y="432" fill="#22211f" font-size="28">signals</text>
  <text data-metric="insufficient-evidence.detected_signals" x="1398" y="470" fill="#22211f" font-size="40" font-weight="700">0</text>
  <line x1="1110" y1="492" x2="1510" y2="492" stroke="#c7c0b4" stroke-width="3"/>
  <text x="1110" y="536" fill="#22211f" font-size="28">repeated_action</text>
  <text data-metric="insufficient-evidence.repeated_action.detected" x="1470" y="536" fill="#22211f" font-size="28" font-weight="700">0</text>
  <text x="1110" y="578" fill="#22211f" font-size="28">tool_error</text>
  <text data-metric="insufficient-evidence.tool_error.detected" x="1470" y="578" fill="#22211f" font-size="28" font-weight="700">0</text>
  <text x="1110" y="620" fill="#22211f" font-size="28">repeated_failure</text>
  <text data-metric="insufficient-evidence.repeated_failure.support" x="1110" y="654" fill="#22211f" font-size="28" font-weight="700">unsupported</text>
  <text x="1110" y="700" fill="#22211f" font-size="28">coverage degraded</text>
  <text data-metric="insufficient-evidence.coverage_degraded" x="1415" y="700" fill="#22211f" font-size="28" font-weight="700">true</text>
