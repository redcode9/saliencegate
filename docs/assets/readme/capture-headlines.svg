<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" role="img" aria-labelledby="capture-headlines-title capture-headlines-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="capture-headlines-title">Three synthetic OpenCode capture report headlines</title>
  <desc id="capture-headlines-desc">Synthetic replay produces Memory review suggested, No current evidence, or Insufficient evidence while preserving zero model calls and no decision authority.</desc>
  <rect data-surface="true" x="0" y="0" width="1600" height="1000" fill="#f6f1e8"/>
  <text x="60" y="72" fill="#22211f" font-size="52" font-weight="700">Three bounded capture headlines</text>
  <text x="60" y="118" fill="#22211f" font-size="30">Fully synthetic OpenCode contract replay; not a real-world efficacy result</text>
  <rect data-surface="true" x="60" y="165" width="460" height="610" rx="14" fill="#dce9e9" stroke="#315f6f" stroke-width="4"/>
  <rect data-series="memory-review-suggested" aria-label="Memory review suggested headline lane" x="60" y="165" width="460" height="14" rx="7" fill="#315f6f"/>
  <text x="90" y="226" fill="#22211f" font-size="28" font-weight="700">Memory review suggested</text>
  <text data-metric="memory-review-suggested.headline" x="90" y="270" fill="#22211f" font-size="28" font-weight="700">memory_review_suggested</text>
  <text data-summary="memory-review-suggested" data-estimated-width="327" x="90" y="320" fill="#22211f" font-size="28">Repeated exact action</text>
  <text data-summary="memory-review-suggested" data-estimated-width="354" x="90" y="356" fill="#22211f" font-size="28">plus two structured tool</text>
  <text data-summary="memory-review-suggested" data-estimated-width="116" x="90" y="392" fill="#22211f" font-size="28">failures</text>
  <text x="90" y="432" fill="#22211f" font-size="28">actions</text>
  <text data-metric="memory-review-suggested.action_identities" x="90" y="470" fill="#22211f" font-size="40" font-weight="700">2</text>
  <text x="234" y="432" fill="#22211f" font-size="28">results</text>
  <text data-metric="memory-review-suggested.structured_results" x="234" y="470" fill="#22211f" font-size="40" font-weight="700">2</text>
  <text x="378" y="432" fill="#22211f" font-size="28">signals</text>
  <text data-metric="memory-review-suggested.detected_signals" x="378" y="470" fill="#22211f" font-size="40" font-weight="700">3</text>
  <line x1="90" y1="492" x2="490" y2="492" stroke="#c7c0b4" stroke-width="3"/>
  <text x="90" y="536" fill="#22211f" font-size="28">repeated_action</text>
  <text data-metric="memory-review-suggested.repeated_action.detected" x="450" y="536" fill="#22211f" font-size="28" font-weight="700">1</text>
  <text x="90" y="578" fill="#22211f" font-size="28">tool_error</text>
  <text data-metric="memory-review-suggested.tool_error.detected" x="450" y="578" fill="#22211f" font-size="28" font-weight="700">2</text>
  <text x="90" y="620" fill="#22211f" font-size="28">repeated_failure</text>
  <text data-metric="memory-review-suggested.repeated_failure.support" x="90" y="654" fill="#22211f" font-size="28" font-weight="700">unsupported</text>
  <text x="90" y="700" fill="#22211f" font-size="28">coverage degraded</text>
  <text data-metric="memory-review-suggested.coverage_degraded" x="395" y="700" fill="#22211f" font-size="28" font-weight="700">false</text>
  <text x="90" y="744" fill="#22211f" font-size="28">report limits</text>
  <text data-metric="memory-review-suggested.limit_count" x="450" y="744" fill="#22211f" font-size="28" font-weight="700">0</text>
