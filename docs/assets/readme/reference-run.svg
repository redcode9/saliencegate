<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="100%" role="img" aria-labelledby="reference-title reference-desc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="reference-title">Local reference run for 1,000 mapped records</title>
  <desc id="reference-desc">A local reference run compares five measured durations, median time against budget, and peak memory against budget for the memory and SQLite backends.</desc>
  <rect data-surface="true" x="0" y="0" width="1600" height="1120" fill="#f6f1e8"/>
  <text x="60" y="72" fill="#22211f" font-size="52" font-weight="700">One local 1,000-record reference run</text>
  <text x="60" y="118" fill="#22211f" font-size="30">Five isolated measurements per backend; bars show use of the stated budgets</text>

  <rect data-surface="true" x="60" y="158" width="1480" height="315" rx="14" fill="#dce9e9" stroke="#315f6f" stroke-width="4"/>
  <rect data-series="memory" aria-label="Memory backend measurement series" x="60" y="158" width="14" height="315" rx="7" fill="#315f6f"/>
  <text x="100" y="212" fill="#22211f" font-size="40" font-weight="700">Memory backend</text>
  <text x="100" y="258" fill="#22211f" font-size="28">Five durations (seconds)</text>
  <text data-metric="memory.duration.1" x="100" y="304" fill="#22211f" font-size="30">4.66473575</text>
  <text data-metric="memory.duration.2" x="370" y="304" fill="#22211f" font-size="30">4.729587833</text>
  <text data-metric="memory.duration.3" x="640" y="304" fill="#22211f" font-size="30">4.57829925</text>
  <text data-metric="memory.duration.4" x="910" y="304" fill="#22211f" font-size="30">4.719111875</text>
  <text data-metric="memory.duration.5" x="1180" y="304" fill="#22211f" font-size="30">4.72002375</text>
  <text x="100" y="362" fill="#22211f" font-size="28">Median seconds</text>
  <text data-metric="memory.median" x="100" y="404" fill="#22211f" font-size="30" font-weight="700">4.719111875</text>
  <text x="430" y="362" fill="#22211f" font-size="28">Time budget (s)</text>
  <text data-metric="memory.time_budget" x="430" y="404" fill="#22211f" font-size="30" font-weight="700">5.0</text>
  <text x="760" y="362" fill="#22211f" font-size="28">Peak RSS (MiB)</text>
  <text data-metric="memory.peak_rss" x="760" y="404" fill="#22211f" font-size="30" font-weight="700">185.40625</text>
  <text x="1090" y="362" fill="#22211f" font-size="28">RSS budget (MiB)</text>
  <text data-metric="memory.rss_budget" x="1090" y="404" fill="#22211f" font-size="30" font-weight="700">512.0</text>
  <rect x="430" y="435" width="280" height="16" rx="8" fill="#c7c0b4"/>
  <rect data-series="memory-time" aria-label="Memory median uses 4.719111875 of the 5 second budget" x="430" y="435" width="264" height="16" rx="8" fill="#315f6f"/>
  <rect x="1090" y="435" width="280" height="16" rx="8" fill="#c7c0b4"/>
  <rect data-series="memory-rss" aria-label="Memory peak RSS uses 185.40625 of the 512 MiB budget" x="1090" y="435" width="101" height="16" rx="8" fill="#315f6f"/>

  <rect data-surface="true" x="60" y="500" width="1480" height="315" rx="14" fill="#f1e0c6" stroke="#9b5c13" stroke-width="4"/>
  <rect data-series="sqlite" aria-label="SQLite backend measurement series" x="60" y="500" width="14" height="315" rx="7" fill="#9b5c13"/>
  <text x="100" y="554" fill="#22211f" font-size="40" font-weight="700">SQLite backend</text>
  <text x="100" y="600" fill="#22211f" font-size="28">Five durations (seconds)</text>
  <text data-metric="sqlite.duration.1" x="100" y="646" fill="#22211f" font-size="30">7.427851125</text>
  <text data-metric="sqlite.duration.2" x="370" y="646" fill="#22211f" font-size="30">7.412707417</text>
  <text data-metric="sqlite.duration.3" x="640" y="646" fill="#22211f" font-size="30">7.398388584</text>
  <text data-metric="sqlite.duration.4" x="910" y="646" fill="#22211f" font-size="30">7.370406125</text>
  <text data-metric="sqlite.duration.5" x="1180" y="646" fill="#22211f" font-size="30">7.507945875</text>
  <text x="100" y="704" fill="#22211f" font-size="28">Median seconds</text>
  <text data-metric="sqlite.median" x="100" y="746" fill="#22211f" font-size="30" font-weight="700">7.412707417</text>
  <text x="430" y="704" fill="#22211f" font-size="28">Time budget (s)</text>
  <text data-metric="sqlite.time_budget" x="430" y="746" fill="#22211f" font-size="30" font-weight="700">15.0</text>
  <text x="760" y="704" fill="#22211f" font-size="28">Peak RSS (MiB)</text>
  <text data-metric="sqlite.peak_rss" x="760" y="746" fill="#22211f" font-size="30" font-weight="700">213.921875</text>
  <text x="1090" y="704" fill="#22211f" font-size="28">RSS budget (MiB)</text>
  <text data-metric="sqlite.rss_budget" x="1090" y="746" fill="#22211f" font-size="30" font-weight="700">512.0</text>
  <rect x="430" y="777" width="280" height="16" rx="8" fill="#c7c0b4"/>
  <rect data-series="sqlite-time" aria-label="SQLite median uses 7.412707417 of the 15 second budget" x="430" y="777" width="138" height="16" rx="8" fill="#9b5c13"/>
  <rect x="1090" y="777" width="280" height="16" rx="8" fill="#c7c0b4"/>
  <rect data-series="sqlite-rss" aria-label="SQLite peak RSS uses 213.921875 of the 512 MiB budget" x="1090" y="777" width="117" height="16" rx="8" fill="#9b5c13"/>

  <rect data-surface="true" x="60" y="845" width="1480" height="225" rx="12" fill="#ffffff"/>
  <text x="90" y="890" fill="#22211f" font-size="28">Platform</text>
  <text data-metric="environment.platform" x="90" y="932" fill="#22211f" font-size="28" font-weight="700">macOS-26.5.2-arm64-arm-64bit</text>
  <text x="720" y="890" fill="#22211f" font-size="28">Python</text>
  <text data-metric="environment.python" x="720" y="932" fill="#22211f" font-size="28" font-weight="700">CPython 3.12.3</text>
  <text x="1040" y="890" fill="#22211f" font-size="28">Cores</text>
  <text data-metric="environment.cores" x="1040" y="932" fill="#22211f" font-size="28" font-weight="700">15</text>
  <text x="1220" y="890" fill="#22211f" font-size="28">Memory MiB</text>
  <text data-metric="environment.memory_mib" x="1220" y="932" fill="#22211f" font-size="28" font-weight="700">24576.0</text>
  <text x="90" y="982" fill="#22211f" font-size="28">Runner image</text>
  <text data-metric="environment.runner_image" x="90" y="1024" fill="#22211f" font-size="28" font-weight="700">unspecified</text>
  <text x="420" y="984" fill="#22211f" font-size="28">Single machine; no agent-quality or provider-latency claim.</text>
  <text x="420" y="1026" fill="#22211f" font-size="28">No cross-machine claim.</text>
</svg>
